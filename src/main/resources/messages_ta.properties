venue.heading=உங்கள் பார்வைக்கு ஏற்ற நிகழ்விடம்
venue.subtitle=உலகத் தர வசதிகள். முடிவற்ற வாய்ப்புகள். நினைவில் நிற்கும் அனுபவங்களுக்காக வடிவமைக்கப்பட்டது.
