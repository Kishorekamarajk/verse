about.story.heading=எங்கள் கதை
about.story.p1=Spring Boot, Thymeleaf மற்றும் Bootstrap போன்ற நம்பகமான கருவிகளை அடிப்படையாகக் கொண்டு அணிகளுக்கு சுத்தமான, நவீன வலைத் தொடக்கத்தை வழங்கும் எளிய யோசனையாக Tecverse தொடங்கியது.
about.story.p2=இந்த உள் பக்கம் முகப்பு பக்கத்துடன் அதே navbar மற்றும் footer fragments-ஐ மீண்டும் பயன்படுத்துகிறது; ஆகவே அவற்றில் செய்யும் மாற்றங்கள் எல்லா இடங்களிலும் தானாகப் பிரதிபலிக்கும்.
