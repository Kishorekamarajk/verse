about.hero.subtitle=ஆராய்ச்சியாளர்கள், புதுமையாளர்கள், ஸ்டார்ட்அப்கள், கல்வியகம், தொழில் மற்றும் அரசை ஒன்றிணைத்து தொழில்நுட்பத்தின் எதிர்காலத்தை வடிவமைக்கும் முன்னணி தொழில்நுட்ப மாநாடு.
about.section.eyebrow=TECVERSE பற்றி
about.section.p1=TECVERSE என்பது ஆராய்ச்சியாளர்கள், புதுமையாளர்கள், ஸ்டார்ட்அப்கள், கல்வியகம், அரசு அமைப்புகள், தொழில் நிபுணர்கள் மற்றும் கொள்கை வடிவமைப்பாளர்களை ஒன்றிணைக்கும் முன்னணி தொழில்நுட்ப மாநாடு.
about.section.p2=புதுமை மற்றும் ஒத்துழைப்பை வேகப்படுத்தும் நோக்கத்துடன், Tec-Verse அறிவுப் பரிமாற்றம், முன்னோடி ஆராய்ச்சி, நெட்வொர்க்கிங், தொழில்நுட்ப பயிற்சிகள் மற்றும் தேசிய டிஜிட்டல் மாற்றத்தை முன்னெடுக்கும் கருத்துகளுக்கான தளமாக செயல்படுகிறது.
about.journey.heading=டெக்-வெர்ஸின் பயணம்
about.journey.subtitle=துணிச்சலான முதல் பதிப்பிலிருந்து வளர்ந்து வரும் தேசிய புதுமை தளமாக.
about.journey.2023.title=அடித்தளம் அமைத்தல்
about.journey.2023.desc=தொடக்க பதிப்பு ஆரம்பகால புதுமையாளர்கள், அரசு அமைப்புகள் மற்றும் கல்வியகத்தை ஒன்றிணைத்து, அடுத்த ஆண்டுகளின் கருப்பொருள் துறைகளை அறிமுகப்படுத்தியது.
about.journey.2024.title=வாய்ப்புகளை விரிவாக்குதல்
about.journey.2024.desc=கண்காட்சியாளர்கள், பேச்சாளர்கள் மற்றும் கூட்டாளர் அமைப்புகள் அதிகரித்தன; AI, சைபர் பாதுகாப்பு மற்றும் செமிகண்டக்டர் தொழில்நுட்பங்கள் போன்ற புதிய துறைகள் இணைந்தன.
about.journey.2025.title=புதுமையை வேகப்படுத்துதல்
about.journey.2025.desc=Tec-Verse தேசிய அளவில் அங்கீகரிக்கப்பட்ட தளமாக வளர்ந்து, அதிக பங்கேற்பு, ஆழமான தொழில்-அரசு ஒத்துழைப்பு மற்றும் விரிந்த கூட்டாளர் வலையமைப்பை உருவாக்கியது.
about.why.heading=ஏன் டெக்-வெர்ஸ்
about.why.subtitle=நீடித்த தேசிய தாக்கத்திற்காக மக்கள், கருத்துகள் மற்றும் தொழில்நுட்பத்தை இணைக்கும் தளம்.
about.why.card1.title=தொழில் & கல்வி இணக்கம்
about.why.card1.desc=ஆராய்ச்சியாளர்கள், ஸ்டார்ட்அப்கள் மற்றும் நிறுவனங்களை இணைத்து கருத்துகளை நடைமுறை தீர்வுகளாக மாற்றுதல்.
about.why.card2.title=அரசு ஆதரவு நம்பிக்கை
about.why.card2.desc=தேசிய நிறுவனங்களுடன் இணைந்து ஏற்பாடு செய்யப்படுவதால் நம்பகத்தன்மையும் நீடித்த தாக்கமும் உறுதி செய்யப்படுகிறது.
about.why.card3.title=தேசிய & உலகளாவிய நெட்வொர்க்கிங்
about.why.card3.desc=பகுதிகள் முழுவதும் பிரதிநிதிகள், கூட்டாளர்கள் மற்றும் பார்வையாளர்களை இணைத்து நீடித்த ஒத்துழைப்புகளை உருவாக்குதல்.
