thematic.heading=கருப்பொருள் துறைகள்
thematic.subheading=குவாண்டம் கணினி மற்றும் செயற்கை நுண்ணறிவு முதல் பவர் எலக்ட்ரானிக்ஸ் மற்றும் அடுத்த தலைமுறை தொடர்பு தொழில்நுட்பம் வரை<br>முக்கிய மற்றும் தொழில்துறை துறைகளில் உள்ள நிஜ சவால்களுக்கு எங்கள் பணிகள் தீர்வளிக்கின்றன.

home.about.eyebrow=TECVERSE 2026 பற்றி
home.about.heading=தொழில்நுட்பம் மற்றும் புதுமையின் மூலம் நாளையை வடிவமைத்தல்
home.about.p1=TECVERSE 2026 என்பது ஆராய்ச்சியாளர்கள், புதுமையாளர்கள், ஸ்டார்ட்அப்கள், கல்வியகம், அரசு அமைப்புகள், தொழில் நிபுணர்கள் மற்றும் கொள்கை வடிவமைப்பாளர்களை ஒன்றிணைக்கும் முன்னணி தொழில்நுட்ப மாநாடு.
home.about.p2=புதுமை மற்றும் ஒத்துழைப்பை வேகப்படுத்தும் நோக்கத்துடன், TECVERSE அறிவுப் பரிமாற்றம், முன்னோடி ஆராய்ச்சி, நெட்வொர்க்கிங், தொழில்நுட்ப பயிற்சிகள் மற்றும் மாற்றத்தை உருவாக்கும் கருத்துகளுக்கான தளமாக செயல்படுகிறது.
home.about.feature1.title=இணையுங்கள் & ஒத்துழையுங்கள்
home.about.feature1.desc=ஆராய்ச்சியாளர்கள், புதுமையாளர்கள் மற்றும் தொழில் தலைவர்களுடன் இணைக.
home.about.feature2.title=புதுமைகளை ஆராயுங்கள்
home.about.feature2.desc=நாளையை வடிவமைக்கும் முன்னோடி தொழில்நுட்பங்களை கண்டறியுங்கள்.
home.about.feature3.title=கற்று வளருங்கள்
home.about.feature3.desc=நடைமுறை பயிற்சிகள் மற்றும் நிபுணர் அமர்வுகளில் பங்கேற்கவும்.
home.about.feature4.title=எதிர்காலத்தை வடிவமைக்கவும்
home.about.feature4.desc=தேசிய டிஜிட்டல் மாற்றத்தை முன்னெடுக்கும் கருத்துகளைப் பகிருங்கள்.
home.about.quote=சிந்தனைகளை ஒன்றிணைத்தல்.<br>எதிர்காலத்தை உருவாக்குதல்.<br>புதுமையை வலுப்படுத்துதல்.
