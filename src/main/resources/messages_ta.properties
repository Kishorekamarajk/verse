venue.name=சென்னை வர்த்தக மையம்
venue.p1=சென்னை வர்த்தக மையம் தென் இந்தியாவின் முக்கியமான கண்காட்சி மற்றும் மாநாட்டு இடங்களில் ஒன்றாகும்.
venue.p2=நந்தம்பாக்கத்தில் அமைந்துள்ள இது சர்வதேச வர்த்தக கண்காட்சிகள், B2B எக்ஸ்போக்கள் மற்றும் தொழில்நுட்பம், கட்டுமானம், ஆற்றல், உற்பத்தி, சில்லறை வணிகம் போன்ற துறைகளின் மாநாடுகளை நடத்துவதில் முக்கிய பங்கு வகிக்கிறது.
venue.p3=உலகத் தர கட்டமைப்பு மற்றும் பல்வேறு பயன்பாட்டு இடங்களுடன், வணிக அமைப்புகள் இணைந்து காட்சிப்படுத்தி வளர சிறந்த இடமாக இது விளங்குகிறது.
