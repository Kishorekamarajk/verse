# =========================================================
# Social Media Integration (Media Coverage section)
# =========================================================
# Each platform is off by default until credentials are supplied - the fetcher
# no-ops (and the DB keeps serving previously stored posts) whenever disabled
# or missing a token/id.

tecverse.social.instagram.enabled=${INSTAGRAM_ENABLED:false}
tecverse.social.instagram.access-token=${INSTAGRAM_ACCESS_TOKEN:}
tecverse.social.instagram.user-id=${INSTAGRAM_USER_ID:}

tecverse.social.facebook.enabled=${FACEBOOK_ENABLED:false}
tecverse.social.facebook.access-token=${FACEBOOK_ACCESS_TOKEN:}
tecverse.social.facebook.page-id=${FACEBOOK_PAGE_ID:}

tecverse.social.twitter.enabled=${TWITTER_ENABLED:false}
tecverse.social.twitter.bearer-token=${TWITTER_BEARER_TOKEN:}
tecverse.social.twitter.user-id=${TWITTER_USER_ID:}
tecverse.social.twitter.handle=${TWITTER_HANDLE:}

