# Local/dev fallback: if CDAC SMTP is unreachable, the OTP is printed in the app
# console so the verify flow can be tested. Set OTP_CONSOLE_FALLBACK=false in production.
tecverse.ticket.otp.console-fallback=${OTP_CONSOLE_FALLBACK:true}



# =========================================================
# JPA / Hibernate
# =========================================================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=${HIBERNATE_BATCH_SIZE:25}
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.default_batch_fetch_size=${HIBERNATE_BATCH_FETCH_SIZE:25}
spring.jpa.open-in-view=false

