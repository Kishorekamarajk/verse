<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<section th:fragment="stats-bar" id="stats-bar" aria-labelledby="stats-bar-heading"
          th:attr="data-statistics-url=@{/api/statistics}" class="stats-bar-section" data-stats-reveal>

    <h2 id="stats-bar-heading" class="visually-hidden">TEC-VERSE by the numbers</h2>

    <div class="container-custom">
        <div class="stats-bar-card">
            <dl class="stats-bar-grid">

                <div class="stats-bar-item" data-reveal-hidden style="--stat-delay:0ms">
                    <div class="stats-bar-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="h-6 w-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"/>
                        </svg>
                    </div>
                    <dd class="stats-bar-value"><span data-stat-value data-stat-key="participants">0</span><span data-stat-suffix hidden>+</span></dd>
                    <dt class="stats-bar-label" th:text="#{home.about.stats.participants}">Participants</dt>
                </div>

                <div class="stats-bar-item" data-reveal-hidden style="--stat-delay:80ms">
                    <div class="stats-bar-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="h-6 w-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 18.75a6 6 0 0 0 6-6v-1.5m-6 7.5a6 6 0 0 1-6-6v-1.5m6 7.5v3.75m-3.75 0h7.5M12 15.75a3 3 0 0 1-3-3V4.5a3 3 0 1 1 6 0v8.25a3 3 0 0 1-3 3Z"/>
                        </svg>
                    </div>
                    <dd class="stats-bar-value"><span data-stat-value data-stat-key="speakers">0</span><span data-stat-suffix hidden>+</span></dd>
                    <dt class="stats-bar-label" th:text="#{home.about.stats.speakers}">Speakers</dt>
                </div>

                <div class="stats-bar-item" data-reveal-hidden style="--stat-delay:160ms">
                    <div class="stats-bar-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="h-6 w-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"/>
                        </svg>
                    </div>
                    <dd class="stats-bar-value"><span data-stat-value data-stat-key="organizations">0</span><span data-stat-suffix hidden>+</span></dd>
                    <dt class="stats-bar-label" th:text="#{home.about.stats.organizations}">Organizations</dt>
                </div>

                <div class="stats-bar-item" data-reveal-hidden style="--stat-delay:240ms">
                    <div class="stats-bar-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="h-6 w-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 3v2.25M17.25 3v2.25M3 18.75V7.5a2.25 2.25 0 0 1 2.25-2.25h13.5A2.25 2.25 0 0 1 21 7.5v11.25m-18 0A2.25 2.25 0 0 0 5.25 21h13.5A2.25 2.25 0 0 0 21 18.75m-18 0v-7.5A2.25 2.25 0 0 1 5.25 9h13.5A2.25 2.25 0 0 1 21 11.25v7.5"/>
                        </svg>
                    </div>
                    <dd class="stats-bar-value"><span data-stat-value data-stat-key="sessions">0</span><span data-stat-suffix hidden>+</span></dd>
                    <dt class="stats-bar-label" th:text="#{home.about.stats.sessions}">Sessions</dt>
                </div>

                <div class="stats-bar-item" data-reveal-hidden style="--stat-delay:320ms">
                    <div class="stats-bar-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" class="h-6 w-6">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M13.19 8.688a4.5 4.5 0 0 1 1.242 7.244l-4.5 4.5a4.5 4.5 0 0 1-6.364-6.364l1.757-1.757m13.35-.622 1.757-1.757a4.5 4.5 0 0 0-6.364-6.364l-4.5 4.5a4.5 4.5 0 0 0 1.242 7.244"/>
                        </svg>
                    </div>
                    <dd class="stats-bar-value"><span data-stat-value data-stat-key="partners">0</span><span data-stat-suffix hidden>+</span></dd>
                    <dt class="stats-bar-label" th:text="#{home.about.stats.partners}">Partners</dt>
                </div>

            </dl>
        </div>
    </div>
</section>

</body>
</html>
