faq.heading=FAQS
faq.q1=What is Techverse 2026?
faq.a1=Techverse 2026 is a technology event bringing together innovators, industry leaders, researchers, startups, and institutions to explore emerging digital solutions.
faq.q2=Is TEC-VERSE 2026 only for IT companies?
faq.a2=No. It welcomes organizations from technology, manufacturing, healthcare, education, government, research, startups, and other innovation-driven sectors.
faq.q3=Will there be networking opportunities?
faq.a3=Yes. The event is designed for meaningful networking across exhibitors, delegates, speakers, investors, innovators, and public sector stakeholders.
faq.q4=Why should I exhibit at Tec-Verse 2026?
faq.a4=Exhibitors can showcase products, demonstrate solutions, meet decision-makers, build partnerships, and gain visibility among a focused technology audience.
faq.q5=What is the scale 2026?
faq.a5=Techverse 2026 is planned as a broad technology platform with exhibitions, sessions, demonstrations, institutional participation, and cross-sector engagement.
faq.q6=What industries will be present at the Tec-Verse?
faq.a6=Expected sectors include IT, electronics, AI, cybersecurity, smart infrastructure, manufacturing, education, healthcare, public services, and deep-tech startups.
faq.q7=When and where is Tec-Verse 2026 taking place?
faq.a7=Event date, venue, and entry information can be updated in the venue section once the final schedule and location details are confirmed.
faq.q8=What types of Tec-Verse options are available?
faq.a8=Participation options can include visitor registration, exhibition stalls, sponsorship, speaker participation, startup showcases, and institutional collaboration.

about.title=About | Tec-Verse 2026
about.pagetitle=About Tecverse
about.tagline=A quick look at who we are and what we build.
about.story.heading=Our Story
about.story.p1=Tecverse started as a simple idea: give teams a clean, modern starting point for their web presence, built on solid, well-known tools like Spring Boot, Thymeleaf, and Bootstrap.
about.story.p2=This inner page reuses the same navbar and footer fragments as the home page, so any change you make to those is reflected everywhere automatically.
