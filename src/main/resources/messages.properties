about.hero.heading=About Tec-Verse
about.hero.subtitle=A flagship technology conclave uniting researchers, innovators, startups, academia, industry, and government to shape the future of technology.
about.section.eyebrow=About TECVERSE
about.section.p1=TECVERSE is a flagship technology conclave bringing together researchers, innovators, startups, academia, government organizations, industry experts, and policymakers to explore emerging technologies shaping the future.
about.section.p2=Organized with the vision of accelerating innovation and collaboration, Tec-Verse provides a platform for knowledge exchange, cutting-edge research, networking, technical workshops, and transformative ideas that drive national digital transformation.
about.journey.heading=Journey of Tec-Verse
about.journey.subtitle=From a bold first edition to a growing national platform for innovation.
about.journey.2023.title=Laying the Foundation
about.journey.2023.desc=The inaugural edition brought together early innovators, government bodies, and academia, introducing the core thematic areas that would define Tec-Verse in the years ahead.
about.journey.2024.title=Expanding Horizons
about.journey.2024.desc=Participation grew across exhibitors, speakers, and partner organizations, with new thematic tracks in AI, cybersecurity, and semiconductor technologies joining the fold.
about.journey.2025.title=Accelerating Innovation
about.journey.2025.desc=Tec-Verse matured into a nationally recognised platform, hosting record participation, deeper industry-government collaboration, and a wider network of strategic partners.
about.why.heading=Why Tec-Verse
about.why.subtitle=A platform built to connect people, ideas, and technology for lasting national impact.
about.why.card1.title=Industry & Academia Synergy
about.why.card1.desc=Bridging researchers, startups, and enterprises to turn ideas into deployable solutions.
about.why.card2.title=Government-Backed Trust
about.why.card2.desc=Organized in association with national institutions, ensuring credibility and lasting impact.
about.why.card3.title=National & Global Networking
